name: Build JSON

on:
  push:
    paths:
      - 'data/*.md'
      - 'scripts/parse_registers.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild transmissions.json
        run: python scripts/parse_registers.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/transmissions.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Rebuild transmissions.json from register data"
            git push
          fi
