name: Telegram Ingest

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install telethon

      - name: Fetch new transmissions
        if: ${{ secrets.TELEGRAM_SESSION != '' }}
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNEL: 'UVB_76_radio'
        run: python scripts/telegram_ingest.py

      - name: Commit and push if changed
        if: ${{ secrets.TELEGRAM_SESSION != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/transmissions.json data/.last_message_id data/UVB76_TELEGRAM_INGEST.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-ingest: new UVB-76 transmissions from Telegram"
            git push
          fi
